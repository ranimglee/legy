apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: leggy-hpa
  namespace: legy-local
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: leggy-application
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
