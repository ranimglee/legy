<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZoneController Tester</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
    }
    h2 {
      color: #333;
      border-bottom: 1px solid #ddd;
    }
    input, textarea, button, select {
      margin: 0.25rem 0;
      padding: 0.5rem;
      width: 300px;
      display: block;
    }
    button {
      cursor: pointer;
    }
    .section {
      margin-bottom: 2rem;
    }
    .response {
      background: #f0f0f0;
      padding: 1rem;
      margin-top: 1rem;
      white-space: pre-wrap;
      border: 1px solid #ccc;
    }
    #map {
      height: 500px;
      margin-top: 2rem;
      border: 2px solid #444;
    }
  </style>
</head>
<body>

  <h1>ZoneController API Tester</h1>

  <!-- 🔐 JWT Login Token -->
  <div class="section">
    <h2>🔐 JWT Authentication</h2>
    <input id="jwt-token" placeholder="Paste your JWT token here" />
    <button onclick="setToken()">Set Token</button>
  </div>

  <!-- 📍 View All Zones and Map -->
  <div class="section">
    <h2>Get All Zones + View on Map</h2>
    <button onclick="getAllZones()">Load Zones</button>
  </div>

  <div id="map"></div>

  <div class="response" id="output">Response will be shown here...</div>

  <!-- 🌍 Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    const base = 'http://localhost:8080/moderateur/zones/get-zones';
    let map = L.map('map').setView([14.6928, -17.4467], 12); // Default to Dakar
    let token = ''; // Will hold the JWT token

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function setToken() {
      token = document.getElementById('jwt-token').value.trim();
      alert('✅ Token set!');
    }

    function showResponse(data) {
      document.getElementById('output').textContent =
        typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    async function getAllZones() {
      try {
        const res = await fetch(`${base}`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (res.status === 401) {
          showResponse('❌ Unauthorized! Invalid or missing token.');
          return;
        }

        const zones = await res.json();
        showResponse(zones);
        drawZonesOnMap(zones);
      } catch (err) {
        showResponse('⚠️ Failed to fetch zones. Check console for errors.');
        console.error(err);
      }
    }

    function drawZonesOnMap(zones) {
      map.eachLayer(layer => {
        if (layer instanceof L.Polygon) map.removeLayer(layer);
      });

      zones.forEach(zone => {
        if (zone.coordinates && Array.isArray(zone.coordinates[0])) {
          const latLngs = zone.coordinates[0].map(coord => [coord[1], coord[0]]); // [lat, lng]

          L.polygon(latLngs, { color: zone.enabled ? 'green' : 'red' })
                  .bindPopup(`<b>${zone.zoneName}</b><br/>Drivers: ${zone.nbrAssignedDrivers}`)
                  .addTo(map);

          if (zones.indexOf(zone) === 0) {
            map.setView(latLngs[0], 13);
          }
        }
      });
    }

  </script>
</body>
</html>
