<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Shift Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .shift-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            padding: 1rem;
            text-align: center;
        }
        .shift-button {
            margin-bottom: 0.5rem;
        }
        .shift-button button {
            width: 100%;
        }
        .day-header {
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="row justify-content-center">
        <!-- Loop per day -->
        <div class="col-md-2 mx-1" *ngFor="let day of week">
            <div class="shift-card">
                <div class="day-header">LUNDI<br><span class="text-muted">19</span></div>
                <div class="shift-button">
                    <button class="btn btn-outline-warning" onclick="requestShift('matin', '2025-05-19')">🌞 Matin</button>
                </div>
                <div class="shift-button">
                    <button class="btn btn-outline-primary" onclick="requestShift('soir', '2025-05-19')">🌙 Soir</button>
                </div>
                <div class="shift-button">
                    <button class="btn btn-outline-success" onclick="requestShift('double', '2025-05-19')">⏱ Double</button>
                </div>
                <div class="shift-button">
                    <button class="btn btn-outline-secondary" onclick="requestShift('repos', '2025-05-19')">🏡 Repos</button>
                </div>
            </div>
        </div>
        <!-- Repeat above block for MARDI to DIMANCHE -->
    </div>
</div>

<script>
    function requestShift(type, date) {
        const dto = {
            shiftId: getShiftIdByTypeAndDate(type, date), // Simulate or fetch shiftId dynamically
            livreurId: 123,  // Replace with current livreur ID
            zoneId: 456      // Replace with actual zone
        };

        fetch('/api/shifts/request', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dto)
        })
            .then(res => {
                if (!res.ok) throw new Error("Request failed");
                return res.json();
            })
            .then(data => alert("Shift request sent!"))
            .catch(err => alert("Error: " + err.message));
    }

    function getShiftIdByTypeAndDate(type, date) {
        // This is a placeholder — replace with actual logic or backend fetch
        return Math.floor(Math.random() * 1000); // Dummy shift ID
    }
</script>

</body>
</html>
