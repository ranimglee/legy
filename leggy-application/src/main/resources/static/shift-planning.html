<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Shift Planning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .shift-card {
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 15px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .shift-entry {
            border-top: 1px solid #ddd;
            padding: 0.5rem 0;
        }
        .shift-entry:first-child {
            border-top: none;
        }
        .status-badge {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <h3 class="text-center mb-4">📅 My Weekly Shift Planning</h3>

    <div class="text-center mb-3">
        <input type="date" id="weekStartInput" class="form-control w-25 d-inline-block">
        <button class="btn btn-primary ms-2" onclick="loadPlanning()">Load My Planning</button>
    </div>

    <div id="planningContainer"></div>
</div>

<script>
    async function loadPlanning() {
        const token = localStorage.getItem("jwtToken");
        if (!token) {
            alert("JWT token not found. Please login first.");
            return;
        }

        const weekStart = document.getElementById('weekStartInput').value;
        if (!weekStart) {
            alert("Please select a start date.");
            return;
        }

        try {
            const response = await fetch(`/api/shifts/livreur/requests?weekStart=${weekStart}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!response.ok) throw new Error("Failed to fetch planning");
            const planning = await response.json();
            renderPlanning(planning);
        } catch (error) {
            console.error('Error loading planning:', error);
            alert("Failed to load planning: " + error.message);
        }
    }

    function renderPlanning(planning) {
        const container = document.getElementById('planningContainer');
        container.innerHTML = '';

        // Group shifts by day
        const grouped = {};
        planning.forEach(shift => {
            if (!grouped[shift.date]) {
                grouped[shift.date] = {
                    day: shift.day,
                    shifts: []
                };
            }
            grouped[shift.date].shifts.push(shift);
        });

        Object.values(grouped).forEach(dayGroup => {
            const card = document.createElement('div');
            card.className = 'shift-card';

            const header = document.createElement('h5');
            header.innerHTML = `<strong>${dayGroup.day}</strong>`;
            card.appendChild(header);

            dayGroup.shifts.forEach(shift => {
                const entry = document.createElement('div');
                entry.className = 'shift-entry';

                const shiftType = document.createElement('p');
                shiftType.innerHTML = `Shift: <strong>${formatShiftType(shift.shiftType)}</strong>`;

                const timeRange = document.createElement('p');
                timeRange.innerHTML = `⏰ ${shift.timeRange}`;

                const status = document.createElement('span');
                status.className = 'badge rounded-pill bg-secondary status-badge';
                status.innerText = shift.status;

                entry.appendChild(shiftType);
                entry.appendChild(timeRange);
                entry.appendChild(status);

                card.appendChild(entry);
            });

            container.appendChild(card);
        });
    }

    function formatShiftType(type) {
        switch (type) {
            case 'MORNING': return '🌞 Morning';
            case 'PEAK_LUNCH': return '🍽️ Lunch Peak';
            case 'AFTERNOON': return '☀️ Afternoon';
            case 'PEAK_DINNER': return '🍽️ Dinner Peak';
            case 'NIGHT': return '🌙 Night';
            case 'DAY_OFF': return '🛌 Day Off';
            case 'Non défini': return 'No shift';
            default: return type;
        }
    }
</script>

</body>
</html>
