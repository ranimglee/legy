global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: '/metrics'  # Default metrics path if using Prometheus plugin in Jenkins
    static_configs:
      - targets: [ 'localhost:9090' ]

  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'localhost:8084' ]
  

  - job_name: 'jenkins'
    metrics_path: '/prometheus'  # Default metrics path if using Prometheus plugin in Jenkins
    static_configs:
      - targets: ['localhost:8080']