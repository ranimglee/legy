name: CI - Build, Test & Deploy to OVH

on:
  push:
    branches: [ "sprint-4-dev" ]

jobs:
  build-test-deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout the repository
      - name: Check Out Repository
        uses: actions/checkout@v3

      # 2) (Optional) Run unit tests if needed
      # - name: Run Unit Tests
      #   run: mvn clean test

      # 3) Docker Hub Login
      - name: Docker Hub - Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 4) Build & Push Docker Image
      - name: Build & Push Docker Image to Docker Hub
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            bramasquare/leggy-application:latest
            bramasquare/leggy-application:${{ github.sha }}
          build-args: |
            PROFILE=dev

      # 5) Set up SSH access to OVH
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_OVH }}

      # 6) Deploy to OVH server
      - name: Deploy to OVH
        env:
          SSH_OPTS: -o StrictHostKeyChecking=no
          REMOTE_HOST: ubuntu@51.75.30.242
        run: |
          ssh $SSH_OPTS $REMOTE_HOST <<'EOF'
            set -euo pipefail
            cd docker/legy
            sudo docker compose down --remove-orphans
            sudo docker container prune -f
            sudo docker image prune -af
            sudo docker compose pull --quiet
            sudo docker compose up -d --pull always --force-recreate
          EOF